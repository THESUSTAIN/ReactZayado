  </head>
  <body class="font-sans antialiased" style="background:#FDFBF6">
    <div id="root">
      <!-- Loader minimal anti écran blanc -->
      <div id="boot-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#FDFBF6;z-index:9999">
        <div style="width:36px;height:36px;border:3px solid #E8E2D8;border-top-color:#0B1B3A;border-radius:50%;animation:spin .8s linear infinite"></div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function(){
        const t=setInterval(()=>{const r=document.getElementById('root');if(r&&r.children.length>1){const l=document.getElementById('boot-loader');if(l)l.style.display='none';clearInterval(t);}},100);
        setTimeout(()=>clearInterval(t),15000);
      })();
    </script>
  </body>
</html>
