server {
  # Railway injecte PORT au démarrage ; l'image nginx officielle remplace
  # ${PORT} et ${BACKEND_URL} via envsubst avant de lancer nginx.
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Résolution DNS dynamique du backend : sans ça, nginx garde l'adresse IP
  # trouvée au démarrage et renvoie 502/504 dès que le backend est redéployé
  # (nouvelle IP sur le réseau privé Railway).
  resolver ${NGINX_RESOLVER} valid=10s ipv6=on;
  set $backend_upstream "${BACKEND_URL}";

  # Point d'entrée unique pour le backend. Le navigateur appelle /api sur
  # app.zayado.net (même origine) ; Railway transporte ensuite la requête sur
  # son réseau privé vers kairos-backend. Le chemin /api est conservé.
  location = /api {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
  }

  # Jamais de cache pour le service worker, la page et le manifest :
  # sinon les navigateurs gardent une ancienne version (écran blanc).
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA : toutes les routes (/, /app, /pricing, /fonctionnalites/...) retombent sur index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets statiques (captures, gif, build CRA) avec cache
  location ~* \.(js|css|png|gif|jpg|jpeg|webp|svg|woff2?|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
