server {
  # Railway injecte PORT au démarrage ; l'image nginx officielle remplace
  # ${PORT} via envsubst avant de lancer nginx. Le Dockerfile fournit 80
  # comme valeur par défaut pour l'exécution locale.
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # L’API reste sur app.zayado.net : le frontend proxyfie /api vers le
  # service backend privé Railway. BACKEND_UPSTREAM est surchargeable.
  location /api/ {
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA : toutes les routes (/, /app, /pricing, /fonctionnalites/...) retombent sur index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets statiques (captures, gif, build CRA) avec cache
  location ~* \.(js|css|png|gif|jpg|jpeg|webp|svg|woff2?|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
