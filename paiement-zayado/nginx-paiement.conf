# À placer sur le serveur qui héberge déjà app.zayado.net (adapter les chemins des certificats).
server {
    listen 443 ssl http2;
    server_name paiement.zayado.net;
    ssl_certificate     /etc/letsencrypt/live/paiement.zayado.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paiement.zayado.net/privkey.pem;

    root /var/www/paiement.zayado.net;      # contenu du dossier frontend/
    index index.html;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /api/ {                          # même API que l'appli : pas de CORS à régler
        proxy_pass https://app.zayado.net/api/;
        proxy_set_header Host app.zayado.net;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
    }
    location / { try_files $uri $uri/ =404; }
}
