<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zayado · Tunnels</title>
  <meta name="description" content="Testez votre projet, créez votre entreprise, trouvez vos premiers clients, structurez et optimisez votre rentabilité — diagnostics gratuits par Zayado." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --cream:#F7F2E9;
      --navy:#101E3D;
      --navy-soft:#243458;
      --gold:#BE9A5E;
      --gold-light:#D8BC86;
      --gold-hover:#a9814a;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:var(--cream); color:var(--navy);
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }
    .serif{font-family:'Cormorant Garamond',Georgia,serif; letter-spacing:-0.01em}
    .navy-grad{background:linear-gradient(135deg,#0d1a36 0%,#101E3D 40%,#243458 100%)}
    .text-gradient-gold{
      background:linear-gradient(90deg,#BE9A5E 0%,#D8BC86 50%,#BE9A5E 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .shadow-soft{box-shadow:0 20px 45px -20px rgba(16,30,61,.25)}
    .shadow-card{box-shadow:0 4px 20px -10px rgba(16,30,61,.15)}
    .btn-gold{background:var(--gold);color:#fff;border:none;cursor:pointer;transition:background .2s}
    .btn-gold:hover:not(:disabled){background:var(--gold-hover)}
    .btn-gold:disabled{opacity:.4;cursor:not-allowed}
    .btn-navy{background:var(--navy);color:#fff;border:none;cursor:pointer;transition:background .2s}
    .btn-navy:hover{background:var(--navy-soft)}
    .btn-outline{background:#fff;color:var(--navy);border:1px solid rgba(16,30,61,.15);cursor:pointer;transition:border-color .2s}
    .btn-outline:hover{border-color:rgba(16,30,61,.3)}
    input,textarea{font-family:inherit;font-size:16px;width:100%;outline:none}
    input:focus,textarea:focus{border-color:var(--gold) !important}
    input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .5s ease both}
    @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .marquee{animation:marquee 40s linear infinite}
    @keyframes spinSlow{to{transform:rotate(360deg)}}
    .spin-slow{animation:spinSlow 2.4s linear infinite}
    @keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
    .pulse{animation:pulseDot 1.2s ease-in-out infinite}

    /* Progress bar top */
    .top-progress{position:fixed;top:0;left:0;right:0;z-index:60;height:4px;background:rgba(16,30,61,.08)}
    .top-progress > div{height:100%;background:var(--gold);transition:width .5s ease;width:0}

    /* Buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:9999px;font-weight:600;font-size:15px}
    .btn.big{padding:16px 36px;font-size:17px}
    .btn.small{padding:10px 20px;font-size:14px}

    /* Pill */
    .pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:rgba(16,30,61,.75);font-size:14px;padding:8px 16px;border-radius:9999px;box-shadow:0 4px 20px -10px rgba(16,30,61,.15)}
    .kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border:1px solid rgba(190,154,94,.3);border-radius:9999px;padding:6px 16px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(16,30,61,.7)}

    /* Option button (questionnaire) */
    .opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 20px;border-radius:16px;background:rgba(255,255,255,.7);border:2px solid transparent;cursor:pointer;text-align:left;color:rgba(16,30,61,.75);font-weight:500;transition:all .18s ease;font-size:15px}
    .opt:hover{background:#fff}
    .opt.on{background:#fff;border-color:var(--gold);color:var(--navy);box-shadow:0 4px 20px -10px rgba(16,30,61,.15)}
    .opt .radio{width:24px;height:24px;border:2px solid rgba(16,30,61,.2);border-radius:9999px;display:flex;align-items:center;justify-content:center;transition:all .18s}
    .opt.on .radio{background:var(--gold);border-color:var(--gold);color:#fff}

    /* Text inputs */
    .txt-input{width:100%;padding:20px;border-radius:16px;border:2px solid transparent;background:#fff;color:var(--navy);font-size:16px;box-shadow:0 4px 20px -10px rgba(16,30,61,.15);resize:none}
    .txt-input::placeholder{color:rgba(16,30,61,.35)}

    /* Ratio card */
    .ratio-card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 20px -10px rgba(16,30,61,.15);border:1px solid rgba(0,0,0,.04)}
    .signal-badge{font-size:11px;font-weight:500;padding:2px 10px;border-radius:9999px}

    /* Teaser blur */
    .teaser-blur{position:absolute;inset:auto 0 0 0;height:280px;background:linear-gradient(to top,#fff 0%,rgba(255,255,255,.96) 40%,transparent 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:32px}

    /* Radar SVG polygon animation */
    .radar-poly{transition:d 1s ease}

    /* Utilities */
    .container-narrow{max-width:640px;margin:0 auto;padding:0 20px}
    .container-mid{max-width:840px;margin:0 auto;padding:0 20px}
    .container-wide{max-width:1120px;margin:0 auto;padding:0 20px}
    .flex-center{display:flex;align-items:center;justify-content:center}
    .icon-svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .icon-lg{width:32px;height:32px}
    .icon-sm{width:14px;height:14px}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    @media(max-width:640px){.grid-3{grid-template-columns:1fr}}
    .marquee-wrap{overflow:hidden;padding:20px 0;border-top:1px solid rgba(0,0,0,.06)}
    .marquee-track{display:flex;gap:32px;white-space:nowrap;width:max-content}
    .marquee-item{font-family:'Cormorant Garamond',serif;font-size:24px;color:rgba(16,30,61,.25);display:inline-flex;gap:32px;align-items:center}
    .close-btn{position:fixed;top:16px;right:20px;z-index:70;width:38px;height:38px;border-radius:9999px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border:none;box-shadow:0 4px 20px -10px rgba(16,30,61,.2);color:rgba(16,30,61,.7);cursor:pointer;display:flex;align-items:center;justify-content:center}
    .close-btn:hover{color:var(--navy)}
    .lock-tip{display:flex;align-items:flex-start;gap:12px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 20px -10px rgba(16,30,61,.15);margin-bottom:20px}

    /* FAQ accordion */
    .faq-wrap{padding:60px 0 80px}
    .faq-item{border-bottom:1px solid rgba(16,30,61,.1)}
    .faq-q{display:flex;align-items:center;justify-content:space-between;width:100%;padding:20px 4px;background:none;border:none;cursor:pointer;text-align:left;font-size:16px;font-weight:600;color:var(--navy)}
    .faq-q .icon-svg{transition:transform .2s ease;flex:none}
    .faq-item.open .faq-q .icon-svg{transform:rotate(45deg)}
    .faq-a{max-height:0;overflow:hidden;transition:max-height .25s ease}
    .faq-item.open .faq-a{max-height:240px}
    .faq-a p{margin:0 4px 18px;color:rgba(16,30,61,.65);font-size:15px;line-height:1.6}

    /* Sticky footer CTA */
    .sticky-footer{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;box-shadow:0 -8px 30px -10px rgba(16,30,61,.25);padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:16px;transform:translateY(100%);transition:transform .25s ease}
    .sticky-footer.show{transform:translateY(0)}
    .sticky-footer p{margin:0;font-size:13px;color:rgba(16,30,61,.6);white-space:nowrap}
    @media(max-width:640px){.sticky-footer p{display:none}}
  </style>
</head>
<body>

<!-- Progress bar -->
<div class="top-progress" id="progressBar" style="display:none"><div id="progressFill"></div></div>
<button class="close-btn" id="closeBtn" style="display:none" aria-label="Quitter" onclick="location.href='../'">
  <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>

<div id="app"></div>

<script src="./tunnels-data.js"></script>
<script>
(function(){
'use strict';
/* Zayado Tunnel — SPA vanilla JS
 * URL: /tunnels/tunnel.html?slug=<slug>
 * State: { step (0..6), answers, result }
 */

const params = new URLSearchParams(location.search);
const slug = params.get('slug') || 'tester-mon-projet';
const { TUNNELS, generateResult, SIGNAL_META, WELLBEING, CHIPS } = window.ZayadoTunnels;
const tunnel = TUNNELS[slug];
const $app = document.getElementById('app');
const $progress = document.getElementById('progressBar');
const $progressFill = document.getElementById('progressFill');
const $close = document.getElementById('closeBtn');

// SEO
if (tunnel) {
  document.title = tunnel.seo.title;
  const desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', tunnel.seo.description);
}

const state = { step: 0, answers: {}, result: null, lead: null };

// Backend API — capture réelle des leads.
// CORRECTIF : `window.__ZAYADO_API__` n'était jamais défini nulle part -> API_BASE
// valait toujours '' -> `if(!API_BASE) return null` sautait l'appel réseau à
// chaque fois -> AUCUN lead n'était jamais transmis au backend (perte silencieuse).
// Fixe : valeur par défaut sur le domaine de prod réel de l'app.
const API_BASE = window.__ZAYADO_API__ || 'https://app.zayado.net';
async function apiAnalyze(slug, payload){
  // Endpoint /api/tunnels/analyze non implémenté côté backend : le score est déjà
  // calculé côté client. Cet appel reste "best effort" — s'il échoue ou 404,
  // on continue avec le calcul client, aucune donnée perdue.
  try{
    const r = await fetch(API_BASE + '/api/tunnels/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({slug, ...payload})
    });
    if(!r.ok) return null;
    return await r.json();
  } catch(e){ return null; }
}
async function apiCreateLead(data){
  // CORRECTIF : pointait vers /api/tunnels/lead, qui n'existe pas côté backend
  // (404 garanti). Le vrai endpoint de capture de lead, déjà en prod et déjà
  // branché sur Brevo (liste #20) + email de rapport automatique, est /api/lead
  // (voir backend/routes/public_routes.py::submit_lead). On réutilise celui-là
  // au lieu d'en réinventer un, et on remappe le payload à son schéma exact
  // (LeadFormRequest : email, first_name, last_name, phone, company, source, tool, results).
  try{
    const r = await fetch(API_BASE + '/api/lead', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        email: data.email,
        first_name: data.prenom || '',
        last_name: '',
        phone: '',
        company: '',
        source: 'tunnel',
        tool: data.tunnel_slug || '',
        results: {
          score: data.score,
          tunnel_id: data.tunnel_id,
          tunnel_name: data.tunnel_name,
          report_id: data.report_id,
          answers: data.answers,
        },
      })
    });
    return r.ok ? await r.json() : null;
  } catch(e){ return null; }
}
async function apiRegister(email, password){
  if(!API_BASE) return null;
  try{
    const r = await fetch(API_BASE + '/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    return r.ok ? await r.json() : null;
  } catch(e){ return null; }
}

// ─── Icons library (inline SVG paths for lucide-like set) ─────────
const ICONS = {
  rocket:   '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
  building: '<rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>',
  users:    '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  layout:   '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>',
  trending: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  arrow:    '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
  arrowL:   '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  check:    '<polyline points="20 6 9 17 4 12"/>',
  shield:   '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  sparkle:  '<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>',
  lock:     '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  unlock:   '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  mail:     '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
  file:     '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  leaf:     '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19.2 2c1 2 2 4.18 2 8 0 4-2 8-8 8-3.54 0-6.16-1.88-7-6.5"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/>',
  check2:   '<circle cx="12" cy="12" r="10"/><polyline points="9 12 12 15 15 9"/>',
  clock:    '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  x:        '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  plus:     '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'
};
function icon(name, cls='icon-svg'){
  return `<svg class="${cls}" viewBox="0 0 24 24">${ICONS[name]||''}</svg>`;
}

function render(){
  if(!tunnel){
    $app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;">
      <div>
        <h1 class="serif" style="font-size:42px;color:var(--navy);margin:0 0 12px">Tunnel introuvable</h1>
        <p style="color:rgba(16,30,61,.6);margin:0 0 24px">Le tunnel demandé n'existe pas.</p>
        <a class="btn btn-gold" href="./index.html">${icon('arrowL')} Voir tous les tunnels</a>
      </div></div>`;
    return;
  }
  $progress.style.display = state.step>0 ? 'block' : 'none';
  $close.style.display = state.step>0 ? 'flex' : 'none';
  $progressFill.style.width = `${(state.step/6)*100}%`;
  window.scrollTo({top:0, behavior:'instant'});

  if(state.step===0) return renderLanding();
  if(state.step===1) return renderQuestionnaire();
  if(state.step===2) return renderLoading();
  if(state.step===3) return renderResult();
  if(state.step===4) return renderTeaser();
  if(state.step===5) return renderUnlock();
  if(state.step===6) return renderSignup();
}

// ─── Step 0 : Landing ─────────────────────────────────────────
function renderLanding(){
  const chipsList = [...CHIPS, ...CHIPS, ...CHIPS];
  const faqItems = tunnel.faq || [];
  $app.innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column">
      <section style="flex:1;display:flex;align-items:center;padding:120px 0 60px">
        <div class="container-mid" style="text-align:center">
          <div class="fade-up">
            <span class="kicker">${icon(tunnel.icon,'icon-svg')} ${tunnel.kicker}</span>
          </div>
          <h1 class="serif fade-up" style="font-size:clamp(38px,7vw,66px);font-weight:500;line-height:1.05;margin:32px 0 0">
            ${tunnel.title} <span class="text-gradient-gold" style="font-style:italic">${tunnel.titleGold}</span>
          </h1>
          <p class="fade-up" style="margin:24px auto 0;color:rgba(16,30,61,.7);font-size:18px;line-height:1.6;max-width:640px">${tunnel.subtitle}</p>
          <div class="fade-up" style="margin-top:32px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px">
            ${tunnel.pills.map(p=>`<span class="pill">${icon('check','icon-sm')}<span style="color:var(--gold)">${''}</span>${p}</span>`).join('')}
          </div>
          <div class="fade-up" style="margin-top:40px">
            <button class="btn btn-gold big shadow-soft" id="startBtn">${tunnel.cta} ${icon('arrow')}</button>
            <p style="margin:16px 0 0;font-size:14px;color:rgba(16,30,61,.5);display:flex;align-items:center;justify-content:center;gap:6px">
              ${icon('shield','icon-sm')} ${tunnel.reassurance}
            </p>
          </div>
        </div>
      </section>
      <div class="marquee-wrap">
        <div class="marquee-track marquee">
          ${chipsList.map(c=>`<span class="marquee-item">${c} <span style="color:var(--gold)">·</span></span>`).join('')}
        </div>
      </div>
      ${faqItems.length ? `
      <section class="faq-wrap">
        <div class="container-narrow">
          <h2 class="serif" style="font-size:clamp(26px,4vw,34px);font-weight:500;text-align:center;margin:0 0 32px">Questions fréquentes</h2>
          <div id="faqList">
            ${faqItems.map((f,i)=>`
              <div class="faq-item" data-i="${i}">
                <button class="faq-q">${f.q} ${icon('plus')}</button>
                <div class="faq-a"><p>${f.a}</p></div>
              </div>`).join('')}
          </div>
        </div>
      </section>` : ''}
      <div class="sticky-footer" id="stickyFooter">
        <p>${icon('shield','icon-sm')} ${tunnel.reassurance}</p>
        <button class="btn btn-gold small" id="stickyBtn">${tunnel.cta} ${icon('arrow','icon-sm')}</button>
      </div>
    </div>`;
  document.getElementById('startBtn').onclick = ()=>{ state.step=1; render(); };
  const stickyBtn = document.getElementById('stickyBtn');
  if(stickyBtn) stickyBtn.onclick = ()=>{ state.step=1; render(); };

  // FAQ accordion
  document.querySelectorAll('.faq-item').forEach(item=>{
    item.querySelector('.faq-q').onclick = ()=> item.classList.toggle('open');
  });

  // Sticky footer : apparaît après le hero, masqué tant qu'on est dessus
  const heroBtn = document.getElementById('startBtn');
  const sticky = document.getElementById('stickyFooter');
  const onScroll = ()=>{
    if(!heroBtn || !sticky) return;
    const rect = heroBtn.getBoundingClientRect();
    if(rect.bottom < 0){ sticky.classList.add('show'); } else { sticky.classList.remove('show'); }
  };
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
}

// ─── Step 1 : Questionnaire ───────────────────────────────────
let qStep = 0;
function renderQuestionnaire(){
  const qs = tunnel.questions;
  const q = qs[qStep];
  const progress = ((qStep+1)/qs.length)*100;
  const val = state.answers[q.id];
  const canNext = q.type==='multi' ? (val||[]).length>0 : (val!==undefined && val!=='' && val!==null);

  let field='';
  if(q.type==='single' || q.type==='multi'){
    field = `<div style="display:flex;flex-direction:column;gap:12px">
      ${q.options.map(opt=>{
        const on = q.type==='multi' ? (val||[]).includes(opt) : val===opt;
        return `<button class="opt ${on?'on':''}" data-opt="${opt.replace(/"/g,'&quot;')}">
          <span>${opt}</span>
          <span class="radio">${on?icon('check','icon-sm'):''}</span>
        </button>`;
      }).join('')}
    </div>`;
  } else if(q.type==='textarea'){
    field = `<textarea class="txt-input" rows="4" placeholder="${q.placeholder||''}" id="tinput">${val||''}</textarea>`;
  } else if(q.type==='number'){
    field = `<input type="number" class="txt-input" style="font-size:20px" placeholder="${q.placeholder||''}" value="${val||''}" id="tinput"/>`;
  }

  $app.innerHTML = `
    <div style="min-height:100vh;padding:100px 0 60px">
      <div class="container-narrow">

        </div>

        ${tunnel.compliance && qStep===0 ? `

            <span style="color:var(--gold);margin-top:2px">${icon('lock','icon-sm')}</span>
            <p style="margin:0;font-size:12px;color:rgba(16,30,61,.6);line-height:1.5">${tunnel.compliance}</p>
          </div>
        ` : ''}

        <div class="fade-up" key="${qStep}">

        </div>

          <button id="backBtn" style="background:none;border:none;color:rgba(16,30,61,.6);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px">${icon('arrowL','icon-sm')} Retour</button>
          <button class="btn btn-gold shadow-soft" id="nextBtn" ${canNext?'':'disabled'}>
            ${qStep===qs.length-1?'Voir mon résultat':'Continuer'} ${icon('arrow')}
          </button>
        </div>

        <p style="text-align:center;margin-top:24px;font-size:12px;color:rgba(16,30,61,.4);display:flex;align-items:center;justify-content:center;gap:6px">
          ${icon('shield','icon-sm')} Vos réponses sont confidentielles
        </p>
      </div>
    </div>`;

  // wire options
  $app.querySelectorAll('.opt').forEach(el=>{
    el.onclick = ()=>{
      const opt = el.dataset.opt;
      if(q.type==='multi'){
        const arr = state.answers[q.id] || [];
        state.answers[q.id] = arr.includes(opt) ? arr.filter(x=>x!==opt) : [...arr, opt];
      } else {
        state.answers[q.id] = opt;
      }
      render();
    };
  });
  const tin = document.getElementById('tinput');
  if(tin){
    tin.oninput = e=>{
      state.answers[q.id] = e.target.value;
      document.getElementById('nextBtn').disabled = !(e.target.value && e.target.value.trim());
    };
    if(q.type==='textarea' || q.type==='number') tin.focus();
  }
  document.getElementById('backBtn').onclick = ()=>{
    if(qStep>0){ qStep--; render(); }
    else { state.step=0; qStep=0; render(); }
  };
  document.getElementById('nextBtn').onclick = async ()=>{
    if(qStep < qs.length-1){ qStep++; render(); }
    else {
      state.step=2; render();
      const start = Date.now();
      const remote = await apiAnalyze(slug, {answers: state.answers});
      state.result = (remote && remote.result) || generateResult(slug, state.answers);
      state.aiReport = remote?.ai_report || '';
      state.reportId = remote?.report_id || null;
      const elapsed = Date.now() - start;
      setTimeout(()=>{ state.step=3; render(); }, Math.max(600, 2400-elapsed));
    }
  };
}

// ─── Radar SVG ────────────────────────────────────────────────
function radarSVG(data, {dark=false, color='#BE9A5E', size=280}={}){
  const cx=size/2, cy=size/2, r=size*0.36;
  const n = data.length;
  const pts = data.map((d,i)=>{
    const a = (Math.PI*2*i)/n - Math.PI/2;
    const rr = r*(d.value/100);
    return [cx + Math.cos(a)*rr, cy + Math.sin(a)*rr];
  });
  const path = pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')+'Z';
  const grid = [0.25,0.5,0.75,1].map(f=>{
    const gp = data.map((_,i)=>{
      const a=(Math.PI*2*i)/n - Math.PI/2;
      return `${(cx+Math.cos(a)*r*f).toFixed(1)},${(cy+Math.sin(a)*r*f).toFixed(1)}`;
    }).join(' ');
    return `<polygon points="${gp}" fill="none" stroke="${dark?'rgba(255,255,255,.12)':'rgba(16,30,61,.1)'}" stroke-width="1"/>`;
  }).join('');
  const axes = data.map((d,i)=>{
    const a=(Math.PI*2*i)/n - Math.PI/2;
    const x2=cx+Math.cos(a)*r, y2=cy+Math.sin(a)*r;
    const tx=cx+Math.cos(a)*(r+22), ty=cy+Math.sin(a)*(r+22);
    return `<line x1="${cx}" y1="${cy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${dark?'rgba(255,255,255,.12)':'rgba(16,30,61,.1)'}" stroke-width="1"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="${dark?'rgba(255,255,255,.85)':'rgba(16,30,61,.7)'}" font-size="12" font-weight="500">${d.axis}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size}px;height:auto">
    ${grid}
    ${axes}
    <path d="${path}" fill="${color}" fill-opacity="0.22" stroke="${color}" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${color}"/>`).join('')}
  </svg>`;
}
