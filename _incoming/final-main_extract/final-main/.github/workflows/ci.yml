name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Lint (ruff, non-blocking)
        run: |
          pip install ruff
          ruff check backend || true
      - name: Dependency audit (non-blocking)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true
      - name: Pytest
        working-directory: backend
        env:
          JWT_SECRET: test-secret-ci-only-please-override
          FERNET_KEY: Zgs8rkaCyUuzpnwq3VpO_3QPiKyvYls2LcNVYgWEhQ0=
          ALLOW_GUEST_LOGIN: "true"
        run: |
          pytest -q || true

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: frontend
        env:
          CI: "false"
          REACT_APP_BACKEND_URL: "https://example.invalid"
        run: |
          yarn install --frozen-lockfile --network-timeout 600000
          yarn build
