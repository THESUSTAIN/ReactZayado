<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zayado · Tunnels — Diagnostics gratuits pour entrepreneurs</title>
  <meta name="description" content="Testez votre projet, créez votre entreprise, trouvez vos premiers clients, structurez votre pilotage et optimisez votre rentabilité — 5 diagnostics gratuits par Zayado." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#F7F2E9;--navy:#101E3D;--navy-soft:#243458;--gold:#BE9A5E;--gold-light:#D8BC86;--gold-hover:#a9814a}
    *{box-sizing:border-box}html,body{margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--navy);-webkit-font-smoothing:antialiased;min-height:100vh}
    .serif{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:-.01em}
    .text-gradient-gold{background:linear-gradient(90deg,#BE9A5E 0%,#D8BC86 50%,#BE9A5E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);border:1px solid rgba(190,154,94,.3);border-radius:9999px;padding:6px 16px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(16,30,61,.7)}
    .container-wide{max-width:1120px;margin:0 auto;padding:0 20px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:9999px;font-weight:600;font-size:15px;text-decoration:none;transition:background .2s}
    .btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--gold-hover)}
    .icon-svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .card{background:#fff;border-radius:24px;padding:32px;box-shadow:0 4px 20px -10px rgba(16,30,61,.15);transition:transform .25s ease,box-shadow .25s ease;display:flex;flex-direction:column;height:100%;text-decoration:none;color:inherit;border:1px solid rgba(0,0,0,.04)}
    .card:hover{transform:translateY(-6px);box-shadow:0 24px 50px -20px rgba(16,30,61,.28);border-color:rgba(190,154,94,.3)}
    .card-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,rgba(190,154,94,.15),rgba(216,188,134,.05));display:flex;align-items:center;justify-content:center;color:var(--gold);margin-bottom:18px}
    .card-icon svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
    .pill{display:inline-flex;align-items:center;gap:4px;background:var(--cream);color:rgba(16,30,61,.75);font-size:12px;padding:4px 10px;border-radius:9999px}
    .badge{display:inline-block;padding:2px 10px;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:rgba(190,154,94,.15);color:var(--gold);margin-bottom:12px}
    .cta-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:20px}
    .cta-link{color:var(--gold);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
  </style>
</head>
<body>

<section style="padding:100px 0 60px;text-align:center">
  <div class="container-wide">
    <span class="kicker">Zayado · Diagnostics gratuits</span>
    <h1 class="serif" style="font-size:clamp(38px,6vw,58px);font-weight:500;line-height:1.05;margin:24px 0 0">
      5 diagnostics pour <span class="text-gradient-gold" style="font-style:italic">avancer sereinement</span>
    </h1>
    <p style="margin:24px auto 0;color:rgba(16,30,61,.7);font-size:18px;line-height:1.6;max-width:640px">
      Testez votre projet, créez votre entreprise, trouvez vos premiers clients, structurez votre pilotage, optimisez votre rentabilité — analyse professionnelle, résultats en quelques minutes.
    </p>
  </div>
</section>

<section style="padding:20px 0 100px">
  <div class="container-wide">
    <div class="grid" id="grid"></div>
  </div>
</section>

<script src="./tunnels-data.js"></script>
<script>
(function(){
  const { TUNNELS } = window.ZayadoTunnels;
  const ICONS = {
    rocket:   '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
    building: '<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/>',
    users:    '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    layout:   '<rect width="18" height="18" x="3" y="3" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>',
    trending: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    arrow:    '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>'
  };
  const list = Object.values(TUNNELS);
  document.getElementById('grid').innerHTML = list.map(t=>`
    <a class="card" href="./tunnel.html?slug=${t.slug}">
      <div class="card-icon"><svg viewBox="0 0 24 24">${ICONS[t.icon]||''}</svg></div>
      <span class="badge">${t.kicker.replace('Tunnel · ','')}</span>
      <h3 class="serif" style="font-size:26px;font-weight:500;margin:0 0 10px;line-height:1.15">
        ${t.title} <span class="text-gradient-gold" style="font-style:italic">${t.titleGold}</span>
      </h3>
      <p style="color:rgba(16,30,61,.65);font-size:14px;line-height:1.5;margin:0 0 18px">${t.subtitle}</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
        ${t.pills.slice(0,3).map(p=>`<span class="pill">${p}</span>`).join('')}
      </div>
      <div class="cta-row">
        <span style="font-size:12px;color:rgba(16,30,61,.5)">${t.reassurance}</span>
        <span class="cta-link">Commencer <svg class="icon-svg" viewBox="0 0 24 24">${ICONS.arrow}</svg></span>
      </div>
    </a>
  `).join('');
})();
</script>
</body>
</html>
