[phases.setup]
nixPkgs = ["python311", "nodejs_20", "yarn", "python311Packages.pip"]
# Install Debian system deps (notamment libstdc++6 pour que greenlet/SQLAlchemy async démarre).
aptPkgs = ["gcc", "g++", "libstdc++6", "build-essential"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  # Recompile greenlet from source pour le lier proprement au libstdc++ système.
  "/opt/venv/bin/pip install --no-binary greenlet 'greenlet>=3.1.1,<4.0.0'",
  "/opt/venv/bin/pip install -r backend/requirements.txt",
  "cd frontend && yarn install --frozen-lockfile --network-timeout 600000",
]

[phases.build]
cmds = [
  "cd frontend && CI=false GENERATE_SOURCEMAP=false yarn build",
  "mkdir -p backend/static && cp -r frontend/build/* backend/static/",
]

[start]
cmd = "cd backend && /opt/venv/bin/uvicorn server:app --host 0.0.0.0 --port $PORT"

[variables]
NODE_VERSION = "20"
PYTHON_VERSION = "3.11"
