name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: development          # force le fallback SQLite (pas de MySQL en CI)
      JWT_SECRET: ci-test-secret-please-change
      FERNET_KEY: ci-fernet-key-placeholder
      ALLOW_GUEST_LOGIN: "true"
      RUN_CRONS: "false"
      DEMO_LOGIN_EMAILS: thomas@zayado.fr
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install fastapi uvicorn sqlalchemy aiosqlite pydantic httpx pytest pytest-asyncio bcrypt pyjwt python-dotenv

      - name: Run backend tests
        run: |
          pip install pytest pytest-asyncio
          pytest -q --maxfail=5 --disable-warnings || (echo "::warning::Some backend tests failed" && exit 1)

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build (smoke)
        env:
          CI: "false"                # n'échoue pas sur les warnings ESLint
          REACT_APP_BACKEND_URL: https://app.zayado.net
        run: yarn build
